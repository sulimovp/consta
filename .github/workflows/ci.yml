name: Tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: Mandatory verify script
        run: bash scripts/verify.sh
      - name: Wheel ships profiles and sample cases
        run: |
          pip install build
          python -m build --wheel -o dist
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/consta list-profiles | grep -qx pytorch
          /tmp/wheel-venv/bin/python -c "from consta.eval.sample_cases import load_sample_cases; assert load_sample_cases()"
