name: Consta Evidence Brief
description: On new issues (or a label), run Consta and post a sticky evidence comment.
author: sulimovp

# Secrets stay in the consumer repo. Default path is retrieval-only
# (--no-synthesis) so maintainers get citations first.
#
# Security: issue titles and report text are attacker-controlled. They reach
# shell and JavaScript only through environment variables and files, never
# through ${{ }} interpolation inside `run:` or `script:`.

inputs:
  github-token:
    description: Token for GitHub API reads and posting the sticky comment
    required: true
  question:
    description: Assessment question; defaults to the issue title
    required: false
    default: ""
  repo:
    description: owner/name to assess; defaults to the current repository
    required: false
    default: ${{ github.repository }}
  path:
    description: Optional module path inside the repo
    required: false
    default: ""
  ecosystem:
    description: Optional ecosystem profile name
    required: false
    default: ""
  synthesize:
    description: Set to "true" to allow LLM synthesis (requires a CONSTA_* LLM key in env)
    required: false
    default: "false"
  version:
    description: consta version to install from PyPI (pin this for reproducible runs)
    required: false
    default: "0.2.1"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Consta
      shell: bash
      env:
        CONSTA_VERSION: ${{ inputs.version }}
      run: pip install "consta==${CONSTA_VERSION}"

    - name: Run Consta
      shell: bash
      env:
        CONSTA_GITHUB_TOKEN: ${{ inputs.github-token }}
        CONSTA_ANTHROPIC_API_KEY: ${{ env.CONSTA_ANTHROPIC_API_KEY }}
        CONSTA_OPENAI_API_KEY: ${{ env.CONSTA_OPENAI_API_KEY }}
        CONSTA_HF_TOKEN: ${{ env.CONSTA_HF_TOKEN }}
        INPUT_QUESTION: ${{ inputs.question }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        INPUT_SYNTHESIZE: ${{ inputs.synthesize }}
      run: |
        set -euo pipefail
        Q="${INPUT_QUESTION:-$ISSUE_TITLE}"
        if [ -z "$Q" ]; then
          echo "::error::No question input and no issue title in this event." >&2
          exit 1
        fi
        ARGS=(-q "$Q" -r "$INPUT_REPO" -o "$RUNNER_TEMP/consta-report.md")
        if [ "$INPUT_SYNTHESIZE" != "true" ]; then ARGS+=(--no-synthesis); fi
        if [ -n "$INPUT_PATH" ]; then ARGS+=(-p "$INPUT_PATH"); fi
        if [ -n "$INPUT_ECOSYSTEM" ]; then ARGS+=(-e "$INPUT_ECOSYSTEM"); fi
        consta assess "${ARGS[@]}"

    - name: Upsert sticky comment
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ runner.temp }}/consta-report.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          if (!context.issue.number) {
            core.setFailed('This action must run on an issue event.');
            return;
          }
          const marker = '<!-- consta-sticky -->';
          const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
          const body = `${marker}\n## Consta evidence brief\n\n${report}`;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
