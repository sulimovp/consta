[project]
name = "consta"
dynamic = ["version"]
description = "Evidence-first OSS contribution assessment CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]
web = [
    "flask>=3",
    "markdown>=3",
]

[project.urls]
Homepage = "https://github.com/sulimovp/consta"
Repository = "https://github.com/sulimovp/consta"

[project.scripts]
consta = "consta.cli:app"
consta-web = "consta.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "consta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["consta"]

# Profiles and sample cases live at the repo root for curators; ship copies
# inside the package so `pip install consta` works outside a checkout.
[tool.hatch.build.targets.wheel.force-include]
"profiles" = "consta/_data/profiles"
"eval/sample_cases.yaml" = "consta/_data/sample_cases.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real GitHub/LLM APIs (enable with CONSTA_RUN_LIVE=1)",
]
